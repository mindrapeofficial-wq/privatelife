name: AO 0.11.5 world census

on:
  push:
    branches:
      - ao0115-source-transfer

permissions:
  contents: write

jobs:
  census:
    if: contains(github.event.head_commit.message, 'run AO0115 world census v4')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ao0115-source-transfer
      - name: Count and validate static world records
        shell: python
        run: |
          import json, pathlib, struct, re
          root=pathlib.Path("transfer/AO0115/extracted/maps/Maps")
          per=[]
          all_npc_ids=[]
          for i in range(1,171):
              mb=(root/f"Mapa{i}.map").read_bytes()
              data=(root/f"Mapa{i}.inf").read_bytes()
              npcs=objs=exits=0
              if len(mb)==130273:
                  if len(data)!=160010:
                      raise SystemExit(f"Mapa{i} V1 inf size {len(data)}")
                  o=10
                  for tile in range(10000):
                      exit_map=struct.unpack_from("<h",data,o)[0]
                      npc=struct.unpack_from("<h",data,o+6)[0]
                      obj=struct.unpack_from("<h",data,o+8)[0]
                      if exit_map>0: exits+=1
                      if npc>0:
                          npcs+=1
                          all_npc_ids.append(npc)
                      if obj>0: objs+=1
                      o+=16
                  fmt="v1"
              else:
                  o=10
                  for tile in range(10000):
                      flags=data[o]; o+=1
                      if flags & 1:
                          o+=6
                          exits+=1
                      if flags & 2:
                          npc=struct.unpack_from("<h",data,o)[0]
                          o+=2
                          if npc>0:
                              npcs+=1
                              all_npc_ids.append(npc)
                      if flags & 4:
                          o+=4
                          objs+=1
                  if o != len(data):
                      raise SystemExit(f"Mapa{i} V2 inf consumed {o} of {len(data)}")
                  fmt="v2"
              per.append({"map":i,"format":fmt,"npcs":npcs,"objects":objs,"exits":exits})

          def npc_sections(path):
              found=set()
              for line in path.read_text(encoding="latin1").splitlines():
                  m=re.match(r"\s*\[NPC(\d+)\]",line,re.I)
                  if m:
                      found.add(int(m.group(1)))
              return found

          datroot=pathlib.Path("transfer/AO0115/extracted/dat/Dat")
          defined=npc_sections(datroot/"NPCs.dat") | npc_sections(datroot/"NPCs-HOSTILES.dat")
          unique_used=sorted(set(all_npc_ids))
          missing=sorted(set(unique_used)-defined)

          total_npcs=sum(x["npcs"] for x in per)
          first_user_char=(total_npcs+1) if total_npcs < 63 else (total_npcs+65)
          summary={
              "maps":170,
              "v1_maps":[x["map"] for x in per if x["format"]=="v1"],
              "v2_maps":[x["map"] for x in per if x["format"]=="v2"],
              "total_static_npcs":total_npcs,
              "total_objects":sum(x["objects"] for x in per),
              "total_exits":sum(x["exits"] for x in per),
              "maps_with_npcs":sum(1 for x in per if x["npcs"]),
              "unique_npc_definition_ids_used":unique_used,
              "missing_npc_definition_ids":missing,
              "first_user_char_index_if_all_static_npcs_spawn":first_user_char,
              "top_npc_maps":sorted(per,key=lambda x:x["npcs"],reverse=True)[:20],
              "per_map":per,
          }
          out=pathlib.Path("transfer/AO0115/WORLD_CENSUS.json")
          out.write_text(json.dumps(summary,indent=2),encoding="utf-8")
      - name: Commit census
        shell: bash
        run: |
          git config user.name "OpenAI preservation"
          git config user.email "actions@github.com"
          git add transfer/AO0115/WORLD_CENSUS.json
          git commit -m "AO0115 world census result v3"
          git push origin HEAD:ao0115-source-transfer
